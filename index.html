<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토토로</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 파란 배너 -->
  <header class="hero">
    <p class="hero-sub">우리 학교 시험 범위를 한 번에 복습해요</p>
    <h1>토토로</h1>
  </header>

  <!-- 단원 검색: script.js가 입력할 때마다 아래 목록을 걸러준다 -->
  <form id="search" class="search" role="search">
    <input id="q" type="search" placeholder="단원 이름을 검색하세요" aria-label="단원 검색" autocomplete="off">
    <button type="submit" aria-label="검색">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
  </form>

  <!-- 과목 해시태그: 선택한 학교의 과목 이름으로 채워진다 -->
  <div id="tags" class="tags"></div>

  <h2 class="section-title">학교별 단원</h2>
  <!-- 학교 선택 버튼 -->
  <nav id="schools" class="schools" aria-label="학교 선택"></nav>

  <!-- 선택한 학교의 단원 카드 목록 -->
  <main id="list" class="units">불러오는 중...</main>

  <script src="script.js"></script>
</body>
</html>
